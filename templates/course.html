<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} · {{ui_siteName}}</title>
<meta name="description" content="{{description}}">
<link rel="alternate" hreflang="fr" href="{{frUrl}}">
<link rel="alternate" hreflang="en" href="{{enUrl}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
{{{demoAssets}}}<style>:root{--accent:{{accent}}}</style>
<script>document.documentElement.className+=' js'</script>
</head>
<body class="page-course">
<div class="topbar">
  <div class="topbar-in">
    <a class="brand" href="{{homeUrl}}">42<span>·</span>{{ui_brand}}</a>
    <span class="crumb" aria-hidden="true">/</span>
    <span class="crumb-name">{{name}}</span>
    <span class="grow"></span>
    <nav class="langs" aria-label="Language">
      <a class="lang" href="{{frUrl}}" hreflang="fr"{{{frCurrent}}}>FR</a>
      <a class="lang" href="{{enUrl}}" hreflang="en"{{{enCurrent}}}>EN</a>
    </nav>
  </div>
  {{{tocNav}}}
</div>
{{{banner}}}
<main{{{mainAttrs}}}>
{{{body}}}
</main>
{{{pagerNav}}}
<footer>
  <div class="line"></div>
  <b>{{ui_siteName}}</b> · {{ui_footer}}
</footer>
{{{demoScripts}}}
<script src="/assets/site.js" defer></script>
</body>
</html>
