<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ui_siteName}}</title>
<meta name="description" content="{{ui_description}}">
<link rel="alternate" hreflang="fr" href="{{frUrl}}">
<link rel="alternate" hreflang="en" href="{{enUrl}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<script>document.documentElement.className+=' js'</script>
</head>
<body class="page-home">
<div class="topbar">
  <div class="topbar-in">
    <a class="brand" href="{{homeUrl}}">42<span>·</span>{{ui_brand}}</a>
    <span class="grow"></span>
    <nav class="langs" aria-label="Language">
      <a class="lang" href="{{frUrl}}" hreflang="fr"{{{frCurrent}}}>FR</a>
      <a class="lang" href="{{enUrl}}" hreflang="en"{{{enCurrent}}}>EN</a>
    </nav>
  </div>
</div>
<header class="hero">
  <span class="kicker"><span class="dot"></span>{{ui_kicker}}</span>
  <h1 class="title">{{{ui_heroTitle}}}</h1>
  <p class="lead">{{{ui_heroLead}}}</p>
</header>
<main class="wrap">
  <div class="filter" role="group" aria-label="{{ui_filterLabel}}">
    {{{filters}}}
  </div>
  <section class="block reveal" data-block="main">
    <div class="grid">
      {{{mainCards}}}
    </div>
  </section>
  <section class="block reveal" id="cpp" data-block="cpp">
    <div class="block-head"><h2>{{ui_cppTitle}}</h2><p>{{ui_cppLead}}</p></div>
    <div class="grid">
      {{{cppCards}}}
    </div>
  </section>
  <section class="block reveal" id="extras" data-block="extras">
    <div class="block-head"><h2>{{ui_extrasTitle}}</h2><p>{{ui_extrasLead}}</p></div>
    <div class="grid">
      {{{extraCards}}}
    </div>
  </section>
</main>
<footer>
  <div class="line"></div>
  <b>{{ui_siteName}}</b> · {{ui_footer}}
</footer>
<script src="/assets/site.js" defer></script>
</body>
</html>
